name: Build Shifa Pharmacy (Windows EXE & Android APK)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: |
          flutter create . --project-name shifa_pharmacy --platforms=android
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Shifa-Pharmacy-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: |
          flutter create . --project-name shifa_pharmacy --platforms=windows
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Shifa-Pharmacy-Windows-EXE
          path: build/windows/x64/runner/Release/
