name: Build Shifa Pharmacy (Windows EXE & Android APK)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Prepare & Build APK
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create . --project-name shifa_pharmacy --platforms=android
          cp -r /tmp/lib_backup/* lib/
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Shifa-Pharmacy-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Prepare & Build Windows EXE
        shell: pwsh
        run: |
          Copy-Item -Path "lib" -Destination "$env:TEMP\lib_backup" -Recurse -Force
          Copy-Item -Path "pubspec.yaml" -Destination "$env:TEMP\pubspec_backup.yaml" -Force
          flutter create . --project-name shifa_pharmacy --platforms=windows
          Copy-Item -Path "$env:TEMP\lib_backup\*" -Destination "lib" -Recurse -Force
          Copy-Item -Path "$env:TEMP\pubspec_backup.yaml" -Destination "pubspec.yaml" -Force
          if (Test-Path "test") { Remove-Item -Recurse -Force "test" }
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Shifa-Pharmacy-Windows-EXE
          path: build/windows/x64/runner/Release/
